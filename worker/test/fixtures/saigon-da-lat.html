0, "have_prebought_ticket": 0, "is_contracted_bus": 0, "is_show_operator_number": 0, "is_tet_ticket": 0, "total_stages": "37", "type": "1", "departure_place": "VP Tân Bình - HCM", "is_payment_before_booking": 0, "min_booking_time": null, "max_booking_time": null, "has_cop": 1, "has_coupons": 0, "has_coupons_ams": 0, "coupons": [], "is_sponsor": 0, "is_vacation_mode": 0, "available_seat_info": {"seat_type": {"2": {"total_available_seat": 36, "fare": [290000, 270000]}}, "seat_group": {"Giường nằm": {"total_available_seat": 34, "fare": [290000]}, "Giường nằm nhỏ": {"total_available_seat": 2, "fare": [270000]}}}, "seat_template_names": ["Limousine sleeping bus", "VIP Cabin bus"], "social_proof_ratings": [], "best_review": {"comp_id": 19133, "detail_review": "정말정말 감사합니다.\n푸미흥에서 달랏 가는 캐빈 버스 쓰실 분들은 여기 쓰세요. 베트남 억양이 있어서 제가 잘 못 알아 듣긴 했지만 쉬운 영어 소통 가능합니다! 사무실에서 버스 탑승 1시간 전에 전화 주시고, 시간 내에 안 와서 몇 번 전홨는데도 친절히 받아주셨어요. 메인게이트에서 셔틀(봉고차) 타면 집결지에 데려다 줘요. 얼타고 있으니까 티켓도 먼저 끊어서 전달해주시고, 기사님이나 차장님은 영어 못 하시지만 하차 지점 오면 알려줍니다. 또 셔틀도 있으니까 그랩 영업 하면 무시하시면 되고, 셔틀 기사님도 몸짓으로 친절히 알려주시니까 호텔 주소만 보여주시면 돼요.\nI really appreciate about everything. If you go to DaLat from PhuMyHung, you just book a bus here. Office worker can speak English little bit. And they called me before 1 hour ago to take the bus. I just waited in LotteMart Dist 7 Main Gate, took the shuttle(silver Mini Van) and they dropped me off hub. Just few minute later, I could take the bus to DaLat. The officer brought ticket and help everything. They are so kindly, friendly. The bus driver and sub driver(?) can't say English, but the point is not the problem. They tried to help me always. When I arrived DaLat, I met taxi driver. So I asked anyone, can I use shuttle. They have shuttle service, that's why I just ignored taxi driver. I just showed hotel address, kindly shuttle driver dropped me off right place.\nI really appreciate about everything. I hope see you again.", "rating": 5, "name": "Park Yun Hye", "created_at": "2024-01-22T04:29:51.586Z", "trip_date": "2024-01-21T16:58:00.000Z", "detail_review_vi": "Cảm ơn bạn rất nhiều. Nếu bạn muốn sử dụng xe cabin từ Phú Mỹ Hưng đi Đà Lạt thì sử dụng tại đây. Tôi rất khó hiểu anh ấy vì anh ấy nói giọng Việt, nhưng tôi có thể dễ dàng giao tiếp bằng tiếng Anh! Văn phòng đã gọi cho tôi một giờ trước khi lên xe, và mặc dù tôi phải chuyển chỗ nhiều lần vì không đến đúng giờ nhưng họ vẫn vui vẻ chấp nhận tôi. Nếu bạn đi xe đưa đón (van) ở cổng chính sẽ đưa bạn đến điểm hẹn. Vì bạn đang ở trên xe nên hãy cắt vé trước và đưa cho họ, dù tài xế hoặc người soát vé không nói được tiếng Anh nhưng họ sẽ cho bạn biết khi đến điểm trả khách. Ngoài ra còn có xe đưa đón nên bạn có thể bỏ qua nếu Grab hoạt động, tài xế đưa đón cũng sẽ vui lòng thông báo bằng cử chỉ nên chỉ cần hiển thị địa chỉ khách sạn là được. Tôi thực sự đánh giá cao mọi thứ. Nếu đi Đà Lạt từ Phú Mỹ Hưng bạn chỉ cần đặt xe khách ở đây. Nhân viên văn phòng có thể nói được một chút tiếng Anh. Và họ đã gọi cho tôi trước 1 giờ để bắt xe buýt. Tôi chỉ đợi ở Cổng chính LotteMart Quận 7, bắt xe đưa đón (Xe Van nhỏ màu bạc) và họ thả tôi ra khỏi trung tâm. Chỉ vài phút sau, tôi đã có thể bắt xe buýt đi Đà Lạt. Viên chức mang vé đến và giúp đỡ mọi việc. Họ thật tử tế, thân thiện. Tài xế xe buýt và tài xế phụ (?) không thể nói tiếng Anh, nhưng vấn đề không phải là vấn đề. Họ luôn cố gắng giúp đỡ tôi. Khi đến Đà Lạt, tôi gặp tài xế taxi. Thế là tôi hỏi mọi người, tôi có thể sử dụng xe đưa đón được không. Họ có dịch vụ đưa đón nên tôi mới phớt lờ tài xế taxi. Tôi vừa cho xem địa chỉ khách sạn, tài xế đưa đón đã đưa tôi đến đúng nơi. Tôi thực sự đánh giá cao mọi thứ. Tôi hi vọng được gặp bạn lần nữa.", "detail_review_en": "Thank you so much. If you want to use the cabin bus from Phu My Hung to Da Lat, use here. I had a hard time understanding him because he had a Vietnamese accent, but I could easily communicate in English! The office called me an hour before boarding the bus, and even though I had to transfer several times because I didn&#39;t arrive on time, they kindly accepted me. If you take a shuttle (van) at the main gate, it will take you to the meeting point. Since you are in a hurry, cut off the ticket first and hand it over. Although the driver or conductor does not speak English, they will let you know when you get to the drop-off point. There is also a shuttle, so you can ignore it if Grab is in operation, and the shuttle driver will also kindly inform you with gestures, so all you have to do is show the hotel address. I really appreciate everything. If you go to DaLat from PhuMyHung, you just book a bus here. Office worker can speak English little bit. And they called me before 1 hour ago to take the bus. I just waited in LotteMart Dist 7 Main Gate, took the shuttle(silver Mini Van) and they dropped me off hub. Just a few minutes later, I could take the bus to DaLat. The officer brought tickets and helped everything. They are so kindly, friendly. The bus driver and sub driver(?) can&#39;t say English, but the point is not the problem. They tried to help me always. When I arrived DaLat, I met taxi driver. So I asked anyone, can I use shuttle. They have shuttle service, that&#39;s why I just ignored taxi driver. I just showed hotel address, kindly shuttle driver dropped me off right place. I really appreciate everything. I hope to see you again.", "id": 232158, "seat_type": 7, "vehicle_quality": 2, "trip_id": 16169545, "trip_name": "Hồ Chí Minh - Đà Lạt (TB-Q5)", "images": ["https://storage.googleapis.com/fe-production/images/review/87GS7D7/img_1705896848575.jpg"], "company_reply": []}}, {"idIndex": "1071613370_2026-10-31_23:40_29_36", "route": {"id": 37965163, "name": "Mien Tay  -  Da Lat", "payment_method": "2", "distance": 360, "departure_date": "2026-10-31T00:00:00+07:00", "departure_time": "23:40", "vehicle_quality": 2, "from": {"id": 29, "name": "Bến xe Miền Tây", "city_id": 29, "sub_type_id": "1"}, "to": {"id": 36, "name": "Bến xe Đà Lạt", "city_id": 36, "sub_type
