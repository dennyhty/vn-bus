sit": 0, "fromName": "Western bus station", "toName": "Da Thien Bus Station", "fromAddress": "395 Kinh Duong Vuong street (Please wait for the operator at the waiting room) - Western bus station", "toAddress": "Da Thien Bus Station (near Mong Mo Hills), Mai Anh Dao Street - Da Thien Bus Station", "isUpdatingFare": 0, "notification": {"category": 1, "label": "Quy định nhà xe", "english_label": "Bus company regulations", "content": "LƯU Ý NHÀ XE\n\n1. Thời gian đến là dự kiến phụ thuộc vào tình hình thời tiết và mật độ giao thông trên đường (ban ngày xe có thể đến trễ từ 1-2 tiếng, ban đêm xe có thể đến sớm 1-2 tiếng so với giờ dự kiến)\n2. Tất cả các xe Trọng Minh đều xuất bến từ BX Miền Tây, các chuyến thể hiện điểm đón là 303 Trần Phú, Quận 5 là xe trung chuyển đưa từ Trần Phú ra bx Miền Tây lên xe, QK vui lòng có mặt trước 30p so với giờ xuất bến để đi trung chuyển.\n3. Đối với những chuyến xe không hiện điểm đón là Trần Phú, QK vui lòng di chuyển ra BX Miền Tây để xuất bến.\n4. Đối với xe phòng: Không áp dụng chính sách trẻ em, tối đa 2 người/phòng bất kể độ tuổi hoặc kích thước\n5. Đối với phòng đôi nằm 1 khách có thể kèm theo em bé dưới 120cm. Trên 120cm tính giá phòng đôi 2 người ((không áp dụng với vé có chương trình khuyến mãi)\n6. Hành lý ký gửi: Mỗi hành khách được phép ký gửi 1 kiện hành lý với trọng lượng tối đa là 20kg xếp chung 1 kiện không tách rời. Nếu hành lý vượt quá trọng lượng quy định, hành khách sẽ phải trả thêm phí hành lý quá cước. Kích thước hành lý ký gửi không được vượt quá 60cm x 40cm x 20cm\n7. NHÀ XE KHÔNG NHẬN THÚ CƯNG DƯỚI MỌI HÌNH THỨC, NẾU QÚY KHÁCH CỐ TÌNH MANG THEO NHÀ XE PHÁT HIỆN CÓ QUYỀN TỪ CHỐI VẬN CHUYỂN THÚ CƯNG HOẶC TỪ CHỐI VẬN CHUYỂN HÀNH KHÁCH MÀ KHÔNG HOÀN LẠI TIỀN VÉ.\n \nLưu ý về Khiếu nại: Để được hỗ trợ tốt nhất, quý khách vui lòng gửi phản hồi hoặc khiếu nại (nếu có) trong vòng 24 giờ kể từ khi kết thúc chuyến đi. Sau thời gian này, nhà xe xin phép từ chối tiếp nhận giải quyết để đảm bảo tính khách quan. Rất mong qu
